name: Playwright Tosca Cloud

on:
  workflow_dispatch:
    inputs:
      tosca_base_url:
        description: 'Tosca Cloud base URL (no trailing slash). Defaults to the TOSCA_BASE_URL repo variable.'
        required: false
      tosca_space:
        description: 'Tosca Cloud space/workspace id. Defaults to the TOSCA_SPACE repo variable.'
        required: false

# Tosca Cloud's "Run GitHub Workflow" module dispatches without inputs, so the
# tenant and space normally come from repository variables.
env:
  TOSCA_BASE_URL: "https://presales.my.tricentis.com/"

  TOSCA_SPACE: "94fdbfd3-30fd-4487-bbf1-414a26c598a6"

jobs:
  test-and-upload:
    runs-on: ubuntu-stepsecurity-x64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test
        continue-on-error: true

      - name: Upload results to Tosca Cloud
        run: >
          node upload.mjs
          --base "https://presales.my.tricentis.com/"
          --space "94fdbfd3-30fd-4487-bbf1-414a26c598a6"
          --clientId "Tricentis_Cloud_API"
          --clientSecret "59KpIEYSVpf9eO4YSMUrzBqw4uxDPL8Vc7OJRty-pf0X-WJquMrAg71UZ9-t3CFV"
          --junit results.xml
          --zip blob-report/report.zip
        env:
          TOSCA_CLIENT_ID: "Tricentis_Cloud_API"
          TOSCA_CLIENT_SECRET: 59KpIEYSVpf9eO4YSMUrzBqw4uxDPL8Vc7OJRty-pf0X-WJquMrAg71UZ9-t3CFV"

      - name: Publish JUnit results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-results
          path: |
            results.xml
            blob-report/report.zip
            playwright-report/**
          retention-days: 14
